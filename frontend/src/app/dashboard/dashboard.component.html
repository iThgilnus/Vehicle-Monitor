<div class="dashboard-container" [class.sidebar-collapsed]="isSidebarCollapsed">
  <!-- Left Sidebar -->
  <app-sidebar 
    [isSidebarCollapsed]="isSidebarCollapsed"
    [selectedMenuItem]="selectedMenuItem"
    (menuItemSelected)="selectMenuItem($event)"
    (sidebarToggled)="toggleSidebar()">
  </app-sidebar>

  <!-- Main Content Area -->
  <main class="main-content">
    <!-- Top Bar -->
    <header class="top-bar">
      <div class="search-container">
        <mat-icon>search</mat-icon>
        <input type="text" placeholder="Search..." class="search-input">
      </div>
      
      <div class="top-bar-actions">
        <button class="notification-button">
          <mat-icon>notifications</mat-icon>
          <span class="notification-badge">3</span>
        </button>
        <div class="user-menu">
          <span class="user-greeting">Welcome, Minh Hải</span>
          <mat-icon>arrow_drop_down</mat-icon>
        </div>
      </div>
    </header>

    <!-- Router Outlet for Dashboard Child Components -->
    <router-outlet></router-outlet>
  </main>
</div>
